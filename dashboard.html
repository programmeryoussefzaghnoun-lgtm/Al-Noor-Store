<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | متجر النور</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body { background: #f4f6f9; }
    .dashboard-layout { display: flex; min-height: 100vh; }
    .sidebar { width: 250px; background: #0b0907; color: #fff; padding: 20px 0; display: flex; flex-direction: column; }
    .sidebar .logo-area { text-align: center; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
    .sidebar .logo-area h2 { color: #d4a24c; font-size: 22px; font-weight: 800; }
    .sidebar a { padding: 15px 20px; color: #ccc; display: flex; align-items: center; gap: 10px; font-weight: 600; transition: 0.3s; text-decoration: none; }
    .sidebar a:hover, .sidebar a.active { background: rgba(212,162,76,.15); color: #f0c776; border-right: 4px solid #d4a24c; }
    .main-content { flex: 1; padding: 30px; overflow-y: auto; }
    .page-title { font-size: 26px; font-weight: 800; color: #2a2118; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .dash-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
    .dash-card h3 { margin-bottom: 15px; color: #2a2118; border-bottom: 2px solid #d4a24c; padding-bottom: 10px; display: inline-block; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 700; color: #2a2118; font-size: 14px; }
    
    .form-group input, .form-group select, .form-group textarea { 
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; outline: none; font-size: 16px !important; 
    }
    
    .form-group input:focus, .form-group textarea:focus { border-color: #d4a24c; }
    .btn-gold { background: linear-gradient(180deg, #f0c776, #d4a24c); color: #000; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; border: none; font-family: inherit; }
    .btn-danger { background: #dc3545; color: #fff; padding: 5px 10px; border-radius: 6px; cursor: pointer; border: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    table th, table td { padding: 12px; text-align: right; border-bottom: 1px solid #eee; }
    table th { background: #f8eadd; color: #2a2118; }
    table img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
    .status-msg { margin-top: 15px; padding: 10px; border-radius: 6px; font-weight: bold; display: none; }
    .status-msg.success { background: #d4edda; color: #155724; display: block; }
    .status-msg.error { background: #f8d7da; color: #721c24; display: block; }

    /* تنسيقات إضافية للتبويبات */
    .image-tabs { display: flex; gap: 10px; margin-bottom: 10px; }
    .image-tabs button { background: #eee; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; font-weight: 700; font-family: inherit; }
    .image-tabs button.active { background: #d4a24c; color: #000; }
    .img-input-section { display: none; }
    .img-input-section.active { display: block; }
  </style>
</head>
<body>

  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="logo-area">
        <h2><i class="fa-solid fa-crown"></i> متجر النور</h2>
        <p style="font-size: 12px; color: #aaa; margin-top: 5px;">لوحة التحكم</p>
      </div>
      <a href="index.html" target="_blank"><i class="fa-solid fa-globe"></i> زيارة الموقع</a>
      <a href="#" class="active" id="nav-products"><i class="fa-solid fa-box"></i> إدارة المنتجات</a>
      <a href="#" id="nav-settings"><i class="fa-solid fa-gear"></i> إعدادات المتجر</a>
      <a href="#" id="logoutBtn" style="color: #ff6b6b; margin-top: auto;"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</a>
    </aside>

    <main class="main-content">
      <div id="section-products">
        <div class="page-title"><span>إدارة المنتجات</span></div>

        <div class="dash-card">
          <h3>إضافة منتج جديد</h3>
          <form id="addProductForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
              <div class="form-group">
                <label>اسم المنتج</label>
                <input type="text" id="pName" required placeholder="مثال: ساعة كاسيو ذهبية">
              </div>
              <div class="form-group">
                <label>السعر (₺)</label>
                <input type="number" id="pPrice" required placeholder="1650">
              </div>
            </div>

            <div class="form-group">
              <label>وصف المنتج</label>
              <textarea id="pDesc" rows="3" placeholder="اكتب وصفاً جذاباً للمنتج..."></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
              <div class="form-group">
                <label>صورة المنتج</label>
                <div class="image-tabs">
                  <button type="button" class="active" onclick="switchTab('url')">رابط من الإنترنت</button>
                  <button type="button" onclick="switchTab('upload')">رفع من الجهاز</button>
                </div>
                <div id="tab-url" class="img-input-section active">
                  <input type="url" id="pImgUrl" placeholder="https://example.com/image.jpg">
                </div>
                <div id="tab-upload" class="img-input-section">
                  <input type="file" id="pImgFile" accept="image/*">
                </div>
              </div>
              <div class="form-group">
                <label>شارة المنتج (اختياري)</label>
                <select id="pBadge">
                  <option value="">بدون شارة</option>
                  <option value="جديد">جديد</option>
                  <option value="خصم 10%">خصم 10%</option>
                  <option value="خصم 20%">خصم 20%</option>
                  <option value="الأكثر مبيعاً">الأكثر مبيعاً</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn-gold" style="margin-top: 10px;" id="submitBtn"><i class="fa-solid fa-plus"></i> إضافة المنتج</button>
            <div id="msg-add" class="status-msg"></div>
          </form>
        </div>

        <div class="dash-card">
          <h3>المنتجات الحالية</h3>
          <table id="productsTable">
            <thead>
              <tr>
                <th>الصورة</th>
                <th>الاسم</th>
                <th>السعر</th>
                <th>الشارة</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody id="productsBody"></tbody>
          </table>
        </div>
      </div>

      <div id="section-settings" style="display: none;">
        <div class="page-title"><span>إعدادات المتجر</span></div>
        <div class="dash-card">
          <h3>بيانات التواصل</h3>
          <form id="settingsForm">
            <div class="form-group">
              <label>رقم الواتساب (بصيغة دولية بدون +)</label>
              <input type="text" id="setWhatsapp" placeholder="905514969472">
            </div>
            <button type="submit" class="btn-gold"><i class="fa-solid fa-save"></i> حفظ الإعدادات</button>
            <div id="msg-settings" class="status-msg"></div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD5vYclVK8iQQOn-CZ39T9EZeWKWNUDYP0",
      authDomain: "al-noor-store-8e504.firebaseapp.com",
      projectId: "al-noor-store-8e504",
      storageBucket: "al-noor-store-8e504.firebasestorage.app",
      messagingSenderId: "5732404882",
      appId: "1:5732404882:web:9687c6ef9e07ad50eaa04b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const storage = getStorage(app);

    // حماية الصفحة
    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = "login.html";
    });

    // تسجيل الخروج
    document.getElementById("logoutBtn").addEventListener("click", (e) => {
      e.preventDefault();
      signOut(auth).then(() => window.location.href = "login.html");
    });

    // تبديل القوائم
    document.getElementById("nav-products").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("section-products").style.display = "block";
      document.getElementById("section-settings").style.display = "none";
      document.getElementById("nav-products").classList.add("active");
      document.getElementById("nav-settings").classList.remove("active");
    });
    document.getElementById("nav-settings").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("section-products").style.display = "none";
      document.getElementById("section-settings").style.display = "block";
      document.getElementById("nav-settings").classList.add("active");
      document.getElementById("nav-products").classList.remove("active");
    });

    // دالة تبديل تبويبات الصورة
    window.switchTab = (type) => {
      document.querySelectorAll('.image-tabs button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.img-input-section').forEach(d => d.classList.remove('active'));
      
      if(type === 'url') {
        document.querySelector('.image-tabs button:nth-child(1)').classList.add('active');
        document.getElementById('tab-url').classList.add('active');
      } else {
        document.querySelector('.image-tabs button:nth-child(2)').classList.add('active');
        document.getElementById('tab-upload').classList.add('active');
      }
    };

    // إدارة المنتجات
    async function loadProducts() {
      const tbody = document.getElementById("productsBody");
      tbody.innerHTML = '<tr><td colspan="5">جاري التحميل...</td></tr>';
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        tbody.innerHTML = "";
        querySnapshot.forEach((docSnap) => {
          const p = docSnap.data();
          const id = docSnap.id;
          tbody.innerHTML += `
            <tr>
              <td><img src="${p.img}" onerror="this.src='https://via.placeholder.com/50'"></td>
              <td>${p.name}</td>
              <td>${p.price} ₺</td>
              <td>${p.badge ? `<span style="background:#d4a24c;color:#000;padding:2px 6px;border-radius:4px;font-size:12px;">${p.badge}</span>` : "لا يوجد"}</td>
              <td><button class="btn-danger" onclick="deleteProduct('${id}')"><i class="fa-solid fa-trash"></i></button></td>
            </tr>
          `;
        });
        if (querySnapshot.empty) tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">لا توجد منتجات مضافة حتى الآن.</td></tr>';
      } catch (error) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:red;">حدث خطأ في الاتصال بقاعدة البيانات.</td></tr>';
      }
    }

    document.getElementById("addProductForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msgDiv = document.getElementById("msg-add");
      const submitBtn = document.getElementById("submitBtn");
      msgDiv.className = "status-msg";
      
      const name = document.getElementById("pName").value;
      const price = Number(document.getElementById("pPrice").value);
      const desc = document.getElementById("pDesc").value;
      const badge = document.getElementById("pBadge").value || null;
      const isUploadTab = document.getElementById('tab-upload').classList.contains('active');
      
      let imgUrl = "";
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...';

      try {
        if (isUploadTab) {
          const fileInput = document.getElementById("pImgFile");
          if (fileInput.files.length === 0) throw new Error("يرجى اختيار صورة للرفع.");
          
          const file = fileInput.files[0];
          const storageRef = ref(storage, 'products/' + Date.now() + '_' + file.name);
          await uploadBytes(storageRef, file);
          imgUrl = await getDownloadURL(storageRef);
        } else {
          imgUrl = document.getElementById("pImgUrl").value;
          if (!imgUrl) throw new Error("يرجى إدخال رابط الصورة.");
        }

        await addDoc(collection(db, "products"), {
          name: name,
          price: price,
          desc: desc,
          img: imgUrl,
          badge: badge,
          createdAt: new Date()
        });
        
        msgDiv.className = "status-msg success";
        msgDiv.textContent = "تم إضافة المنتج بنجاح!";
        e.target.reset();
        switchTab('url');
        
        setTimeout(() => msgDiv.className = "status-msg", 3000);
        loadProducts();
      } catch (error) {
        console.error("خطأ: ", error);
        msgDiv.className = "status-msg error";
        msgDiv.textContent = error.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-plus"></i> إضافة المنتج';
      }
    });

    window.deleteProduct = async (id) => {
      if (confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
        try {
          await deleteDoc(doc(db, "products", id));
          loadProducts();
        } catch (error) { alert("حدث خطأ في الحذف."); }
      }
    };

    // إعدادات المتجر
    const settingsDocRef = doc(db, "settings", "general");
    async function loadSettings() {
      try {
        const docSnap = await getDoc(settingsDocRef);
        if (docSnap.exists() && docSnap.data().whatsapp) {
          document.getElementById("setWhatsapp").value = docSnap.data().whatsapp;
        }
      } catch (error) {}
    }
    document.getElementById("settingsForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msgDiv = document.getElementById("msg-settings");
      try {
        await setDoc(settingsDocRef, { whatsapp: document.getElementById("setWhatsapp").value }, { merge: true });
        msgDiv.className = "status-msg success";
        msgDiv.textContent = "تم حفظ الإعدادات بنجاح!";
        setTimeout(() => msgDiv.className = "status-msg", 3000);
      } catch (error) {
        msgDiv.className = "status-msg error";
        msgDiv.textContent = "حدث خطأ أثناء الحفظ.";
      }
    });

    loadProducts();
    loadSettings();
  </script>
</body>
</html>
