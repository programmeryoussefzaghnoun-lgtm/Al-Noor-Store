<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استعادة كلمة المرور | متجر النور</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body { background: #f4f6f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-box { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    .auth-box h2 { color: #0b0907; margin-bottom: 10px; font-weight: 800; }
    .auth-box p { color: #666; margin-bottom: 25px; font-size: 14px; line-height: 1.6; }
    .form-group { margin-bottom: 20px; text-align: right; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 700; color: #2a2118; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; outline: none; font-family: inherit; font-size: 16px; /* منع الزوم */ }
    .form-group input:focus { border-color: #d4a24c; }
    .btn-gold { width: 100%; padding: 12px; background: linear-gradient(180deg, #f0c776, #d4a24c); color: #000; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 16px; margin-bottom: 15px; }
    .btn-gold:hover { filter: brightness(1.1); }
    .links a { color: #d4a24c; text-decoration: none; font-size: 14px; font-weight: 700; display: block; }
    .msg { font-size: 13px; font-weight: 700; margin-bottom: 10px; display: none; padding: 10px; border-radius: 6px; }
    .msg.success { background: #d4edda; color: #155724; display: block; }
    .msg.error { background: #f8d7da; color: #721c24; display: block; }
  </style>
</head>
<body>

  <div class="auth-box">
    <h2>استعادة كلمة المرور</h2>
    <p>أدخل بريدك الإلكتروني المسجل لدينا، وسنرسل لك رابطاً لإعادة تعيين كلمة المرور.</p>
    
    <div id="msg" class="msg"></div>

    <form id="resetForm">
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="resetEmail" required placeholder="admin@alnour.com">
      </div>
      <button type="submit" class="btn-gold">إرسال الرابط</button>
    </form>

    <div class="links">
      <a href="login.html">العودة لتسجيل الدخول</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD5vYclVK8iQQOn-CZ39T9EZeWKWNUDYP0",
      authDomain: "al-noor-store-8e504.firebaseapp.com",
      projectId: "al-noor-store-8e504",
      storageBucket: "al-noor-store-8e504.firebasestorage.app",
      messagingSenderId: "5732404882",
      appId: "1:5732404882:web:9687c6ef9e07ad50eaa04b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById("resetForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("resetEmail").value;
      const msgDiv = document.getElementById("msg");
      const btn = e.target.querySelector("button");

      btn.textContent = "جاري الإرسال...";
      btn.disabled = true;
      msgDiv.className = "msg";

      sendPasswordResetEmail(auth, email)
        .then(() => {
          msgDiv.className = "msg success";
          msgDiv.textContent = "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني. يرجى تفقد صندوق الوارد أو مجلد الرسائل غير المرغوب فيها (Spam).";
          btn.textContent = "إرسال الرابط";
          btn.disabled = false;
          e.target.reset();
        })
        .catch((error) => {
          msgDiv.className = "msg error";
          if (error.code === "auth/user-not-found") {
            msgDiv.textContent = "هذا البريد الإلكتروني غير مسجل لدينا.";
          } else {
            msgDiv.textContent = "حدث خطأ: " + error.message;
          }
          btn.textContent = "إرسال الرابط";
          btn.disabled = false;
        });
    });
  </script>
</body>
</html>
